name: Hourly Video Scraper

on:
  schedule:
    # প্রতি ১ ঘণ্টা পরপর চালানোর জন্য Cron Syntax (At minute 0)
    - cron: '0 * * * *'
  # ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update scraped video data [skip ci]" && git push)
